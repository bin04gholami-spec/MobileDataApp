name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y             git             zip             unzip             autoconf             automake             libtool             pkg-config             zlib1g-dev             libncurses5-dev             libncursesw5-dev             libtinfo6             cmake             libffi-dev             libssl-dev             gettext             autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0"
          python -m pip install "cython<3"

      - name: Configure Android SDK license acceptance
        run: |
          test -f buildozer.spec
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text(encoding="utf-8")

          if "android.accept_sdk_license" not in text:
              marker = "[app]"
              if marker not in text:
                  raise SystemExit("ERROR: [app] section was not found in buildozer.spec")
              text = text.replace(
                  marker,
                  marker + "\nandroid.accept_sdk_license = True",
                  1,
              )
              p.write_text(text, encoding="utf-8")
              print("Added android.accept_sdk_license = True")
          else:
              lines = []
              for line in text.splitlines():
                  if line.strip().startswith("android.accept_sdk_license"):
                      lines.append("android.accept_sdk_license = True")
                  else:
                      lines.append(line)
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("Forced android.accept_sdk_license = True")
          PY

          echo "===== Android settings ====="
          grep -nE '^(android\.(accept_sdk_license|api|minapi|sdk|ndk|sdk_path|ndk_path))' buildozer.spec || true

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          yes | buildozer -v android debug

      - name: Show build result
        if: always()
        run: |
          echo "===== APK/AAB files ====="
          find bin -maxdepth 1 -type f -print 2>/dev/null || true

          echo "===== Android SDK build-tools ====="
          find "$HOME/.buildozer/android/platform/android-sdk/build-tools"             -maxdepth 1 -mindepth 1 -type d -print 2>/dev/null || true

          echo "===== AIDL ====="
          find "$HOME/.buildozer/android/platform/android-sdk"             -name aidl -type f -print 2>/dev/null || true

          echo "===== Build logs ====="
          find .buildozer -type f             \( -name "*.log" -o -name "*.txt" \)             -print 2>/dev/null | head -100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileDataApp-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobileDataApp-Build-Logs
          path: .buildozer/
          if-no-files-found: warn
