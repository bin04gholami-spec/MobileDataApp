name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ArtemHirnov/buildozer-action@v1
        with:
          command: android debug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
